name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:

jobs:
  unit:
    name: Unit tests and static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  integration:
    name: Integration tests (Elasticsearch ${{ matrix.elasticsearch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['7.17.27']
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite integration
        env:
          ELASTICSEARCH_URL: http://localhost:9200
